<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tannins</title>
  <link rel="manifest" href="/public/manifest.json">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg: #1c1a18;
      --surface: #272420;
      --surface2: #312d29;
      --border: #3d3731;
      --accent: #9b3f5e;
      --accent-hover: #b24e71;
      --text: #f0ebe4;
      --text-muted: #9a9189;
      --radius: 8px;
      --font: system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      width: 100%;
      max-width: 420px;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 160px;
      height: 160px;
    }

    .logo-img {
      max-width: 160px;
      max-height: 160px;
      object-fit: contain;
      border-radius: var(--radius);
    }

    .logo-placeholder {
      width: 160px;
      height: 160px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-placeholder svg {
      opacity: 0.35;
    }

    .restaurant-name {
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .nav-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }

    .btn-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      min-height: 56px;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background 0.15s, transform 0.1s;
      padding: 0 1.5rem;
    }

    .btn-beverages {
      background: var(--accent);
      color: #fff;
    }
    .btn-beverages:hover { background: var(--accent-hover); }
    .btn-beverages:active { transform: scale(0.98); }

    .btn-cuisine {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-cuisine:hover { background: var(--surface2); border-color: var(--accent); }
    .btn-cuisine:active { transform: scale(0.98); }

    .btn-icon {
      font-size: 1.2rem;
      line-height: 1;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo-wrap" id="logoWrap">
    <div class="logo-placeholder">
      <svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M36 12C36 12 20 22 20 38C20 46.837 27.163 54 36 54C44.837 54 52 46.837 52 38C52 22 36 12 36 12Z" stroke="#f0ebe4" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M36 54V60" stroke="#f0ebe4" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M28 60H44" stroke="#f0ebe4" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M26 35C27.5 31 31 28 36 28" stroke="#f0ebe4" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div class="restaurant-name" id="restaurantName">Tannins</div>

  <div class="nav-buttons">
    <a class="btn-nav btn-beverages" id="btnBeverages" href="#">
      <span class="btn-icon">🍷</span>
      Beverages
    </a>
    <a class="btn-nav btn-cuisine" id="btnCuisine" href="#">
      <span class="btn-icon">🍽️</span>
      Cuisine
    </a>
  </div>
</div>

<script>
  const slug = location.pathname.split('/')[1];

  document.getElementById('btnBeverages').href = `/${slug}/server`;
  document.getElementById('btnCuisine').href = `/${slug}/cuisine`;

  async function init() {
    try {
      const res = await fetch(`/api/${slug}/restaurant`);
      if (!res.ok) return;
      const data = await res.json();
      if (data.name) document.getElementById('restaurantName').textContent = data.name;
      if (data.logo_image_path) {
        const wrap = document.getElementById('logoWrap');
        wrap.innerHTML = `<img class="logo-img" src="/${data.logo_image_path.replace(/\\/g, '/')}" alt="${data.name} logo">`;
      }
    } catch (e) {
      // silently keep defaults
    }
  }

  init();
</script>
</body>
</html>
