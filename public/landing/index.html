<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easily Paired</title>
  <link rel="manifest" href="/public/manifest.json">
  <script>try{if(localStorage.getItem('contrast')==='high')document.documentElement.setAttribute('data-contrast','high')}catch(e){}</script>
  <link rel="stylesheet" href="/public/landing/landing.css">
</head>
<body>

<!-- ── Top: Easily Paired (our) brand — GLOBAL, identical for every tenant ──── -->
<header class="brand-top">
  <img class="brand-logo-img" src="/public/easily-paired-logo.jpg" alt="Easily Paired">
</header>

<!-- ── Middle: client / tenant brand — data-driven per slug ─────────────────── -->
<main class="card">
  <div class="logo-wrap" id="logoWrap">
    <div class="logo-placeholder">
      <svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M36 12C36 12 20 22 20 38C20 46.837 27.163 54 36 54C44.837 54 52 46.837 52 38C52 22 36 12 36 12Z" stroke="#f0ebe4" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M36 54V60" stroke="#f0ebe4" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M28 60H44" stroke="#f0ebe4" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M26 35C27.5 31 31 28 36 28" stroke="#f0ebe4" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div class="restaurant-name" id="restaurantName"></div>

  <div class="nav-buttons">
    <a class="btn-nav btn-beverages" id="btnBeverages" href="#">
      <span class="btn-icon">🍷</span>
      Beverages
    </a>
    <a class="btn-nav btn-cuisine" id="btnCuisine" href="#">
      <span class="btn-icon">🍽️</span>
      Cuisine
    </a>
  </div>
</main>

<!-- ── Bottom: copyright — GLOBAL ──────────────────────────────────────────── -->
<footer class="copyright">© 2026 Pairz LLC</footer>

<script type="module">
  import { hexToHsl, hslToHex, applyTheme } from '/public/theme.js';

  const slug = location.pathname.split('/')[1];

  document.getElementById('btnBeverages').href = `/${slug}/server`;
  document.getElementById('btnCuisine').href = `/${slug}/cuisine`;

  async function init() {
    try {
      const res = await fetch(`/api/${slug}/restaurant`);
      if (!res.ok) return;
      const data = await res.json();
      applyTheme(data.theme_accent, data.theme_bg);
      if (data.name) {
        document.getElementById('restaurantName').textContent = data.name;
        document.title = data.name;
      }
      if (data.logo_image_path) {
        const wrap = document.getElementById('logoWrap');
        wrap.innerHTML = `<img class="logo-img" src="/${data.logo_image_path.replace(/\\/g, '/')}" alt="${data.name} logo">`;
      }
    } catch (e) {
      // silently keep defaults
    }
  }

  init();
</script>
</body>
</html>
