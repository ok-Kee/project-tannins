<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easily Paired — Cuisine</title>
  <link rel="manifest" id="pwa-manifest">
  <script>document.getElementById("pwa-manifest").href=window.location.pathname.split("/").slice(0,2).join("/")+"/manifest.json";</script>
  <script>try{if(localStorage.getItem('contrast')==='high')document.documentElement.setAttribute('data-contrast','high')}catch(e){}</script>
  <link rel="stylesheet" href="/public/cuisine/cuisine.css">
</head>
<body>

<header>
  <a id="homeLink" href="#" style="text-decoration:none;color:inherit">
    <h1>Easily Paired — Cuisine</h1>
  </a>
  <span class="slug-badge" id="slugBadge"></span>
  <button class="btn-nav-link btn-contrast" id="btnContrast" type="button" aria-pressed="false" title="Toggle high-contrast mode"><span aria-hidden="true">◐</span><span>High Contrast</span></button>
  <a class="btn-nav-link" id="btnBeverages" href="#">Beverages</a>
  <a class="btn-nav-link" id="btnAdmin" href="#">Admin</a>
</header>

<!-- MENU VIEW -->
<div id="menuView">
  <div id="menuGroups">
    <div class="empty-state">Loading…</div>
  </div>
</div>

<!-- PAIRINGS VIEW -->
<div id="pairingsView">
  <div class="pairings-header">
    <button class="btn-back" id="btnBack">← Menu</button>
    <div class="pairings-dish-name" id="pairingsDishName"></div>
  </div>
  <div id="pairingsList"></div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title" id="mTitle"></div>
      <span class="modal-rack" id="mRack" style="display:none"></span>
      <button class="btn-close" id="btnClose" aria-label="Close">✕</button>
    </div>
    <div class="modal-prices" id="mPrices"></div>
    <div id="mFlavor">
      <div class="section-label">Flavor Profile</div>
      <div class="section-text" id="mFlavorText"></div>
    </div>
    <div id="mPairing">
      <div class="section-label">Pairing</div>
      <div class="section-text" id="mPairingText"></div>
    </div>
    <div id="mSommelier">
      <div class="section-label">Sommelier Notes</div>
      <div class="section-text" id="mSommelierText"></div>
    </div>
    <div id="mSnack">
      <div class="section-label">Snack Pairing</div>
      <div class="section-text" id="mSnackText"></div>
    </div>
    <div class="modal-images" id="mImages"></div>
  </div>
</div>

<script type="module">
  import { hexToHsl, hslToHex, applyTheme, initContrastToggle } from '/public/theme.js';

  const slug = location.pathname.split('/')[1];
  initContrastToggle('btnContrast');
  document.getElementById('slugBadge').textContent = slug;
  document.getElementById('homeLink').href = `/${slug}`;
  document.getElementById('btnBeverages').href = `/${slug}/server`;
  document.getElementById('btnAdmin').href = `/${slug}/de`;

  function $(id) { return document.getElementById(id); }
  function fmt$(v) { return v != null ? `$${Number(v).toFixed(2)}` : null; }

  let menuItems = [];

  // ── Pairing display sampling ───────────────────────────────────────────────
  // Dishes can have many pairings (e.g. steak → 30+). For the guest view we cap
  // the display at 5, chosen to span a price range: 2 low, 2 mid, 1 expensive,
  // using bottle price (falling back to glass). Tiers are relative to this dish's
  // own priced pairings (tertiles). Dishes with ≤5 pairings show all. The full
  // set stays in the DB and admin/other views are unaffected. Selection is cached
  // per dish so it stays stable for the life of the page (a reload re-samples).
  const DISPLAY_CAP = 5;
  const sampleCache = new Map();

  function priceOf(p) {
    return p.price_btl != null ? p.price_btl : (p.price_btg != null ? p.price_btg : null);
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function samplePairings(pairings) {
    if (pairings.length <= DISPLAY_CAP) return pairings;

    const priced = pairings.filter(p => priceOf(p) != null)
                           .sort((a, b) => priceOf(a) - priceOf(b));
    const unpriced = pairings.filter(p => priceOf(p) == null);

    const n = priced.length;
    const t1 = Math.floor(n / 3);
    const t2 = Math.floor((2 * n) / 3);
    const low = priced.slice(0, t1);
    const mid = priced.slice(t1, t2);
    const high = priced.slice(t2);

    const picked = [];
    const seen = new Set();
    const pickFrom = (pool, count) => {
      for (const p of shuffle(pool)) {
        if (picked.length >= DISPLAY_CAP || count <= 0) break;
        if (seen.has(p)) continue;
        seen.add(p);
        picked.push(p);
        count--;
      }
    };

    pickFrom(low, 2);
    pickFrom(mid, 2);
    pickFrom(high, 1);
    // Backfill to the cap if a tier was short (or many wines lack prices).
    if (picked.length < DISPLAY_CAP) {
      pickFrom([...low, ...mid, ...high, ...unpriced], DISPLAY_CAP - picked.length);
    }

    // Preserve the sommelier's intended ordering for the chosen wines.
    return picked.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  }

  // ── Load menu items ────────────────────────────────────────────────────────
  async function init() {
    const [restaurantRes, menuRes] = await Promise.all([
      fetch(`/api/${slug}/restaurant`),
      fetch(`/api/${slug}/menu-items`)
    ]);
    const restaurantData = await restaurantRes.json();
    applyTheme(restaurantData.theme_accent, restaurantData.theme_bg);
    menuItems = await menuRes.json();
    renderMenu();
  }

  // ── Render menu groups ─────────────────────────────────────────────────────
  function renderMenu() {
    const container = $('menuGroups');
    if (!menuItems.length) {
      container.innerHTML = '<div class="empty-state">No menu items set up yet.<br>Ask your manager to configure the menu in the admin panel.</div>';
      return;
    }

    // Group by category
    const groups = new Map();
    menuItems.forEach(item => {
      const key = item.category || '';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(item);
    });

    container.innerHTML = '';
    // Render named categories first, then uncategorized
    const sortedKeys = [...groups.keys()].sort((a, b) => {
      if (!a) return 1;
      if (!b) return -1;
      return a.localeCompare(b);
    });

    sortedKeys.forEach(key => {
      const group = document.createElement('div');
      group.className = 'category-group';
      if (key) {
        const heading = document.createElement('div');
        heading.className = 'category-heading';
        heading.textContent = key;
        group.appendChild(heading);
      }
      groups.get(key).forEach(item => {
        const el = document.createElement('div');
        el.className = 'menu-item';
        el.innerHTML = `
          <div class="mi-info">
            <div class="mi-name">${item.name}</div>
            ${item.description ? `<div class="mi-desc">${item.description}</div>` : ''}
          </div>
          <div class="mi-right">
            ${item.price != null ? `<span class="mi-price">${fmt$(item.price)}</span>` : ''}
            <span class="mi-chevron">›</span>
          </div>
        `;
        el.addEventListener('click', () => showPairings(item));
        group.appendChild(el);
      });
      container.appendChild(group);
    });
  }

  // ── Show pairings for a menu item ──────────────────────────────────────────
  async function showPairings(item) {
    $('pairingsDishName').textContent = item.name;
    $('pairingsList').innerHTML = '<div class="empty-state">Loading…</div>';
    $('menuView').style.display = 'none';
    $('pairingsView').style.display = 'block';

    const res = await fetch(`/api/${slug}/menu-items/${item.id}/pairings`);
    const pairings = await res.json();
    let shown = sampleCache.get(item.id);
    if (!shown) {
      shown = samplePairings(pairings);
      sampleCache.set(item.id, shown);
    }
    renderPairings(shown);
  }

  function renderPairings(pairings) {
    const container = $('pairingsList');
    if (!pairings.length) {
      container.innerHTML = '<div class="empty-state">No pairings set up for this dish yet.</div>';
      return;
    }
    container.innerHTML = '';
    pairings.forEach(entry => {
      const item = document.createElement('div');
      item.className = 'result-item';
      const btg = fmt$(entry.price_btg);
      const btl = fmt$(entry.price_btl);
      item.innerHTML = `
        <div class="ri-rack">${entry.rack_number || '—'}</div>
        <div class="ri-info">
          <div class="ri-name">${entry.beverage_name}</div>
          <div class="ri-meta">${entry.beverage_type || ''}</div>
        </div>
        <div class="ri-prices">
          ${btg ? `<div><strong>${btg}</strong> <span style="font-size:0.7rem">BTG</span></div>` : ''}
          ${btl ? `<div><strong>${btl}</strong> <span style="font-size:0.7rem">BTL</span></div>` : ''}
        </div>
      `;
      item.addEventListener('click', () => openModal(entry));
      container.appendChild(item);
    });
  }

  // ── Back to menu ───────────────────────────────────────────────────────────
  $('btnBack').addEventListener('click', () => {
    $('pairingsView').style.display = 'none';
    $('menuView').style.display = 'block';
  });

  // ── Modal ──────────────────────────────────────────────────────────────────
  function mdToHtml(text) {
    const esc = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const lines = esc.split('\n');
    const out = [];
    let inList = false;
    for (const raw of lines) {
      const line = raw.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
      if (/^[-*] /.test(line)) {
        if (!inList) { out.push('<ul>'); inList = true; }
        out.push('<li>' + line.slice(2) + '</li>');
      } else {
        if (inList) { out.push('</ul>'); inList = false; }
        if (line.trim()) out.push('<p>' + line + '</p>');
      }
    }
    if (inList) out.push('</ul>');
    return out.join('');
  }

  function setText(elId, val, fallback = 'Not specified') {
    const el = $(elId);
    if (val && val.trim()) {
      el.innerHTML = mdToHtml(val);
      el.classList.remove('empty');
    } else {
      el.textContent = fallback;
      el.classList.add('empty');
    }
  }

  function openModal(entry) {
    $('mTitle').textContent = entry.beverage_name;
    const rack = $('mRack');
    if (entry.rack_number) {
      rack.textContent = 'Rack ' + entry.rack_number;
      rack.style.display = '';
    } else {
      rack.style.display = 'none';
    }

    const pricesEl = $('mPrices');
    pricesEl.innerHTML = '';
    const btg = fmt$(entry.price_btg);
    const btl = fmt$(entry.price_btl);
    if (btg) pricesEl.innerHTML += `<div class="price-chip"><div class="pc-label">By the Glass</div><div class="pc-val">${btg}</div></div>`;
    if (btl) pricesEl.innerHTML += `<div class="price-chip"><div class="pc-label">Per Bottle</div><div class="pc-val">${btl}</div></div>`;

    // Flavor profile: the restaurant's house override wins; otherwise the shared AI note
    setText('mFlavorText', entry.house_flavor_profile || entry.flavor_profile, 'No flavor notes available');
    // Pairing: the note for THIS dish + beverage (house override wins over the AI note)
    setText('mPairingText', entry.house_pairing_text || entry.ai_pairing_text, 'No pairing notes available');
    setText('mSommelierText', entry.sommelier_comments);
    setText('mSnackText', entry.snack_notes);

    const imgEl = $('mImages');
    imgEl.innerHTML = '';
    if (entry.label_image_path) imgEl.innerHTML += `<img class="modal-img" src="/${entry.label_image_path.replace(/\\/g,'/')}" alt="Label">`;
    if (entry.bottle_image_path) imgEl.innerHTML += `<img class="modal-img" src="/${entry.bottle_image_path.replace(/\\/g,'/')}" alt="Bottle">`;

    $('modalOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    $('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  $('btnClose').addEventListener('click', closeModal);
  $('modalOverlay').addEventListener('click', e => { if (e.target === $('modalOverlay')) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  init();
</script>
</body>
</html>
