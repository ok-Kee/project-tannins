<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tannins — Wine Lookup</title>
  <link rel="manifest" href="/public/manifest.json">
  <link rel="stylesheet" href="/public/server/server.css">
</head>
<body>

<header>
  <a id="homeLink" href="#" style="display:flex;align-items:center;gap:0.6rem;text-decoration:none;color:inherit">
    <img class="header-logo" id="headerLogo" alt="Logo">
    <h1>Tannins</h1>
  </a>
  <span class="slug-badge" id="slugBadge"></span>
  <a class="btn-nav-link" id="btnCuisine" href="#">Cuisine</a>
  <a class="btn-nav-link" id="btnAdmin" href="#">Admin</a>
</header>

<div class="filter-chips" id="filterChips"></div>

<div class="search-bar">
  <div class="search-field">
    <label class="field-label">Rack #</label>
    <select id="rackSelect">
      <option value="">— All racks —</option>
    </select>
  </div>
  <div class="search-field">
    <label class="field-label">Beverage Name</label>
    <div class="combo-wrap">
      <input type="text" id="beverageSearch" placeholder="Search wines…" autocomplete="off">
      <div class="combo-list" id="beverageList"></div>
    </div>
  </div>
</div>

<div class="results" id="results">
  <div class="empty-state">Loading…</div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title" id="mTitle"></div>
      <span class="modal-rack" id="mRack" style="display:none"></span>
      <button class="btn-close" id="btnClose" aria-label="Close">✕</button>
    </div>

    <div class="modal-prices" id="mPrices"></div>

    <div id="mGeneralPairing">
      <div class="section-label">General Pairing</div>
      <div class="section-text" id="mGeneralPairingText"></div>
    </div>

    <div id="mHousePairing">
      <div class="section-label">House Pairing</div>
      <div class="section-text" id="mHousePairingText"></div>
    </div>

    <div id="mSommelier">
      <div class="section-label">Sommelier Notes</div>
      <div class="section-text" id="mSommelierText"></div>
    </div>

    <div id="mSnack">
      <div class="section-label">Snack Pairing</div>
      <div class="section-text" id="mSnackText"></div>
    </div>

    <div id="mFoodPairings" style="display:none">
      <div class="section-label">Pairs With</div>
      <div id="mFoodPairingsList"></div>
    </div>

    <div class="modal-images" id="mImages"></div>
  </div>
</div>

<script type="module">
  import { hexToHsl, hslToHex, applyTheme } from '/public/theme.js';

  const slug = location.pathname.split('/')[1];
  document.getElementById('slugBadge').textContent = slug;
  document.getElementById('homeLink').href = `/${slug}`;
  document.getElementById('btnCuisine').href = `/${slug}/cuisine`;
  document.getElementById('btnAdmin').href = `/${slug}/de`;

  function $(id) { return document.getElementById(id); }
  function fmt$(v) { return v != null ? `$${Number(v).toFixed(2)}` : null; }

  let allEntries = [];
  let activeCategory = '';

  // ── Load data ──────────────────────────────────────────────────────────────
  async function init() {
    const [restaurantRes, racksRes, listRes] = await Promise.all([
      fetch(`/api/${slug}/restaurant`),
      fetch(`/api/${slug}/racks`),
      fetch(`/api/${slug}/wine-list`)
    ]);
    const restaurantData = await restaurantRes.json();
    applyTheme(restaurantData.theme_accent, restaurantData.theme_bg);
    if (restaurantData.logo_image_path) {
      const logo = document.getElementById('headerLogo');
      logo.src = '/' + restaurantData.logo_image_path.replace(/\\/g, '/');
      logo.style.display = 'block';
    }
    const racks = await racksRes.json();
    allEntries = await listRes.json();

    const sel = $('rackSelect');
    racks.forEach(r => {
      const o = document.createElement('option');
      o.value = r.id;
      o.textContent = r.rack_number;
      sel.appendChild(o);
    });

    renderFilterChips();
    renderResults(allEntries);
  }

  // ── Category filter chips ──────────────────────────────────────────────────
  function renderFilterChips() {
    const types = [...new Set(allEntries.map(e => e.beverage_type).filter(Boolean))].sort();
    const container = $('filterChips');
    container.innerHTML = '';

    const allChip = document.createElement('button');
    allChip.className = 'chip active';
    allChip.textContent = 'All';
    allChip.addEventListener('click', () => setCategory(''));
    container.appendChild(allChip);

    types.forEach(type => {
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = type;
      chip.dataset.type = type;
      chip.addEventListener('click', () => setCategory(type));
      container.appendChild(chip);
    });
  }

  function setCategory(type) {
    activeCategory = type;
    $('filterChips').querySelectorAll('.chip').forEach(c => {
      c.classList.toggle('active', (c.dataset.type || '') === type);
    });
    applyFilters();
  }

  // ── Shared filter logic ────────────────────────────────────────────────────
  function applyFilters() {
    const rackId = $('rackSelect').value;
    const q = $('beverageSearch').value.trim().toLowerCase();
    let filtered = allEntries;
    if (activeCategory) filtered = filtered.filter(e => e.beverage_type === activeCategory);
    if (rackId) filtered = filtered.filter(e => String(e.rack_id) === rackId);
    if (q) filtered = filtered.filter(e => e.beverage_name.toLowerCase().includes(q));
    renderResults(filtered);
  }

  // ── Rack filter ────────────────────────────────────────────────────────────
  $('rackSelect').addEventListener('change', () => {
    $('beverageSearch').value = '';
    $('beverageList').classList.remove('open');
    applyFilters();
  });

  // ── Beverage search ────────────────────────────────────────────────────────
  let debounce = null;
  const beverageSearch = $('beverageSearch');
  const beverageList = $('beverageList');

  beverageSearch.addEventListener('input', () => {
    clearTimeout(debounce);
    $('rackSelect').value = '';
    const q = beverageSearch.value.trim().toLowerCase();
    if (!q) {
      beverageList.classList.remove('open');
      applyFilters();
      return;
    }
    debounce = setTimeout(() => {
      const matches = allEntries.filter(e => e.beverage_name.toLowerCase().includes(q));
      renderCombo(matches);
      applyFilters();
    }, 150);
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.combo-wrap')) beverageList.classList.remove('open');
  });

  function renderCombo(items) {
    beverageList.innerHTML = '';
    if (!items.length) {
      beverageList.innerHTML = '<div style="padding:0.6rem 0.85rem;color:var(--text-muted);font-size:0.85rem">No wines found</div>';
      beverageList.classList.add('open');
      return;
    }
    items.slice(0, 20).forEach(entry => {
      const div = document.createElement('div');
      div.className = 'combo-item';
      div.innerHTML = `<span>${entry.beverage_name}</span><span class="ci-sub">${entry.beverage_type || ''} ${entry.rack_number ? '· Rack ' + entry.rack_number : ''}</span>`;
      div.addEventListener('mousedown', e => {
        e.preventDefault();
        beverageList.classList.remove('open');
        beverageSearch.value = entry.beverage_name;
        applyFilters();
      });
      beverageList.appendChild(div);
    });
    beverageList.classList.add('open');
  }

  // ── Results list ───────────────────────────────────────────────────────────
  function renderResults(entries) {
    const container = $('results');
    if (!entries.length) {
      container.innerHTML = '<div class="empty-state">No wines found.</div>';
      return;
    }
    container.innerHTML = '';
    entries.forEach(entry => {
      const item = document.createElement('div');
      item.className = 'result-item';
      const btg = fmt$(entry.price_btg);
      const btl = fmt$(entry.price_btl);
      item.innerHTML = `
        <div class="ri-rack">${entry.rack_number || '—'}</div>
        <div class="ri-info">
          <div class="ri-name">${entry.beverage_name}</div>
          <div class="ri-meta">${entry.beverage_type || ''}</div>
        </div>
        <div class="ri-prices">
          ${btg ? `<div><strong>${btg}</strong> <span style="font-size:0.7rem">BTG</span></div>` : ''}
          ${btl ? `<div><strong>${btl}</strong> <span style="font-size:0.7rem">BTL</span></div>` : ''}
        </div>
      `;
      item.addEventListener('click', () => openModal(entry));
      container.appendChild(item);
    });
  }

  // ── Modal ──────────────────────────────────────────────────────────────────
  function mdToHtml(text) {
    const esc = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const lines = esc.split('\n');
    const out = [];
    let inList = false;
    for (const raw of lines) {
      const line = raw.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
      if (/^[-*] /.test(line)) {
        if (!inList) { out.push('<ul>'); inList = true; }
        out.push('<li>' + line.slice(2) + '</li>');
      } else {
        if (inList) { out.push('</ul>'); inList = false; }
        if (line.trim()) out.push('<p>' + line + '</p>');
      }
    }
    if (inList) out.push('</ul>');
    return out.join('');
  }

  function setText(elId, val, fallback = 'Not specified') {
    const el = $(elId);
    if (val && val.trim()) {
      el.innerHTML = mdToHtml(val);
      el.classList.remove('empty');
    } else {
      el.textContent = fallback;
      el.classList.add('empty');
    }
  }

  function openModal(entry) {
    $('mTitle').textContent = entry.beverage_name;

    const rack = $('mRack');
    if (entry.rack_number) {
      rack.textContent = 'Rack ' + entry.rack_number;
      rack.style.display = '';
    } else {
      rack.style.display = 'none';
    }

    // Prices
    const pricesEl = $('mPrices');
    pricesEl.innerHTML = '';
    const btg = fmt$(entry.price_btg);
    const btl = fmt$(entry.price_btl);
    if (btg) pricesEl.innerHTML += `<div class="price-chip"><div class="pc-label">By the Glass</div><div class="pc-val">${btg}</div></div>`;
    if (btl) pricesEl.innerHTML += `<div class="price-chip"><div class="pc-label">Per Bottle</div><div class="pc-val">${btl}</div></div>`;
    if (!btg && !btl) pricesEl.innerHTML = '';

    setText('mGeneralPairingText', entry.general_pairing, 'No pairing notes available');
    setText('mHousePairingText', entry.house_pairing);
    setText('mSommelierText', entry.sommelier_comments);
    setText('mSnackText', entry.snack_notes);

    // Images
    const imgEl = $('mImages');
    imgEl.innerHTML = '';
    if (entry.label_image_path) {
      imgEl.innerHTML += `<img class="modal-img" src="/${entry.label_image_path.replace(/\\/g,'/')}" alt="Label">`;
    }
    if (entry.bottle_image_path) {
      imgEl.innerHTML += `<img class="modal-img" src="/${entry.bottle_image_path.replace(/\\/g,'/')}" alt="Bottle">`;
    }

    // Food pairings
    const fpSection = $('mFoodPairings');
    const fpList = $('mFoodPairingsList');
    fpSection.style.display = 'none';
    fpList.innerHTML = '';
    fetch(`/api/${slug}/wine-list/${entry.id}/pairings`)
      .then(r => r.ok ? r.json() : [])
      .then(pairings => {
        if (!pairings.length) return;
        fpList.innerHTML = `<div class="food-pairing-chips">${pairings.map(p => `<span class="food-chip">${p.name}</span>`).join('')}</div>`;
        fpSection.style.display = '';
      });

    $('modalOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    $('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  $('btnClose').addEventListener('click', closeModal);
  $('modalOverlay').addEventListener('click', e => {
    if (e.target === $('modalOverlay')) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  init();
</script>
</body>
</html>
