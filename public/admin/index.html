<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easily Paired Admin</title>
  <link rel="manifest" href="/public/manifest.json">
  <script>try{if(localStorage.getItem('contrast')==='high')document.documentElement.setAttribute('data-contrast','high')}catch(e){}</script>
  <link rel="stylesheet" href="/public/admin/admin.css">
</head>
<body>

<header>
  <a id="homeLink" href="#" style="display:flex;align-items:center;gap:0.6rem;text-decoration:none;color:inherit">
    <img class="header-logo" id="headerLogo" alt="Logo">
    <h1>Easily Paired Admin</h1>
  </a>
  <span class="slug-badge" id="slugBadge"></span>
  <span class="mode-badge new" id="modeBadge">New Entry</span>
  <button class="btn-nav-link btn-contrast" id="btnContrast" type="button" aria-pressed="false" title="Toggle high-contrast mode"><span aria-hidden="true">◐</span><span>High Contrast</span></button>
  <a class="btn-nav-link" id="btnServerView" href="#">Server View</a>
</header>

<div class="layout">
  <!-- FORM PANEL -->
  <div class="form-panel">

    <!-- Logo section (always visible) -->
    <div class="logo-section">
      <img class="logo-preview-img" id="logoPreviewImg" alt="Logo">
      <div class="logo-placeholder-icon" id="logoPlaceholderIcon">🍷</div>
      <div class="logo-meta">
        <div class="logo-label">Restaurant Logo &amp; Theme</div>
        <div class="logo-actions">
          <label class="file-input-label-sm" for="logoInput">📷 Choose…</label>
          <input type="file" id="logoInput" accept="image/jpeg,image/png">
          <button class="btn-logo-save" id="btnLogoSave">Save</button>
        </div>
        <div class="theme-color-row">
          <label class="theme-color-label" for="themeAccent">Accent</label>
          <input type="color" id="themeAccent" value="#9b3f5e">
          <label class="theme-color-label" for="themeBg">Background</label>
          <input type="color" id="themeBg" value="#1c1a18">
        </div>
      </div>
    </div>

    <!-- Wine entry form -->
    <div id="wineSection">

      <div class="field">
        <label>Rack #</label>
        <div style="display:flex;gap:0.5rem;align-items:center">
          <select id="rackId" style="flex:1"></select>
          <button class="btn-rack-add" id="btnAddRack" title="Add a new rack number">+ Rack</button>
        </div>
        <div id="addRackRow" style="display:none;margin-top:0.4rem;display:none;gap:0.4rem;align-items:center">
          <input type="text" id="newRackInput" placeholder="e.g. A1, 42, BTG" style="flex:1">
          <button class="btn-rack-save" id="btnSaveRack">Add</button>
          <button class="btn-rack-cancel" id="btnCancelRack">✕</button>
        </div>
      </div>

      <div class="field">
        <label>Beverage Name</label>
        <div class="combo-wrap">
          <input type="text" id="beverageInput" placeholder="Search beverages…" autocomplete="off">
          <div class="combo-list" id="beverageList"></div>
        </div>
        <input type="hidden" id="beverageId">
      </div>

      <div class="field">
        <label>Type</label>
        <div class="checkbox-grid" id="typeGrid"></div>
      </div>

      <div class="field">
        <label>General Pairing <span style="font-size:0.7rem;color:var(--text-muted)">(auto-filled)</span></label>
        <textarea id="generalPairing" readonly placeholder="Select a beverage to auto-fill…"></textarea>
      </div>

      <div class="field">
        <label>House Pairing</label>
        <textarea id="housePairing" placeholder="Leave blank to use the auto-filled general pairing above — or write your own to override it here."></textarea>
      </div>

      <div class="field">
        <label>Flavor Profile <span style="font-size:0.7rem;color:var(--text-muted)">(auto-filled)</span></label>
        <textarea id="flavorProfile" readonly placeholder="Select a beverage to auto-fill…"></textarea>
      </div>

      <div class="field">
        <label>House Flavor Profile</label>
        <textarea id="houseFlavorProfile" placeholder="Leave blank to use the auto-filled flavor profile above — or write your own to override it here."></textarea>
      </div>

      <div class="field">
        <label>Sommelier Comments</label>
        <textarea id="sommelierComments" placeholder="Tasting notes, aromas, style…"></textarea>
      </div>

      <div class="field">
        <label>Snack Notes</label>
        <textarea id="snackNotes" placeholder="Snack pairing suggestions…"></textarea>
      </div>

      <div class="field" id="winePairingSection" style="display:none">
        <label>Menu Pairings</label>
        <div class="combo-wrap">
          <input type="text" id="winePairingSearch" placeholder="Search menu items…" autocomplete="off">
          <div class="combo-list" id="winePairingComboList"></div>
        </div>
        <div class="pairing-list" id="winePairingList"></div>
      </div>

      <div class="row-2">
        <div class="field">
          <label>Price per Bottle ($)</label>
          <input type="number" id="priceBtl" placeholder="0.00" step="0.01" min="0">
        </div>
        <div class="field">
          <label>Price by Glass ($)</label>
          <input type="number" id="priceBtg" placeholder="0.00" step="0.01" min="0">
        </div>
      </div>

      <div class="row-2">
        <div class="field file-field">
          <label>Label Image</label>
          <img class="file-preview" id="labelPreview" alt="Label">
          <label class="file-input-label" for="labelImage">📷 Choose image…</label>
          <input type="file" id="labelImage" accept="image/jpeg,image/png">
        </div>
        <div class="field file-field">
          <label>Bottle Image</label>
          <img class="file-preview" id="bottlePreview" alt="Bottle">
          <label class="file-input-label" for="bottleImage">📷 Choose image…</label>
          <input type="file" id="bottleImage" accept="image/jpeg,image/png">
        </div>
      </div>

      <div class="form-actions">
        <button class="btn-clear" id="btnClear">Clear</button>
        <button class="btn-save" id="btnSave">Save Entry</button>
      </div>

    </div><!-- /wineSection -->

    <!-- Menu section -->
    <div id="menuSection">

      <!-- Menu item form -->
      <div class="menu-form-area" id="menuItemForm">
        <div class="menu-section-title" id="menuFormTitle">New Menu Item</div>
        <div class="field">
          <label>Name</label>
          <input type="text" id="menuItemName" placeholder="e.g. Ribeye Steak">
        </div>
        <div class="field">
          <label>Category</label>
          <input type="text" id="menuItemCategory" placeholder="e.g. Mains, Starters, Desserts">
        </div>
        <div class="field">
          <label>Description</label>
          <textarea id="menuItemDesc" placeholder="Brief description…" style="min-height:60px"></textarea>
        </div>
        <div class="field">
          <label>Price</label>
          <input type="number" id="menuItemPrice" placeholder="0.00" step="0.01" min="0">
        </div>
        <div class="field">
          <label>Sort Order</label>
          <input type="number" id="menuItemOrder" placeholder="0" min="0" value="0">
        </div>
        <div class="form-actions">
          <button class="btn-clear" id="btnMenuClear">Clear</button>
          <button class="btn-save" id="btnMenuSave">Add Item</button>
        </div>
      </div>

      <!-- Pairing management (shown when a menu item is selected) -->
      <div id="pairingSection">
        <div class="pairing-header">
          <button class="btn-back-sm" id="btnPairingBack">← Back</button>
          <div class="pairing-dish-label" id="pairingDishLabel"></div>
        </div>
        <div class="pairing-body">
          <div class="pairing-search-area">
            <div class="menu-section-title">Add Beverage Pairing</div>
            <div class="combo-wrap">
              <input type="text" id="pairingSearch" placeholder="Search wine list…" autocomplete="off">
              <div class="combo-list" id="pairingComboList"></div>
            </div>
          </div>
          <div>
            <div class="menu-section-title">Current Pairings</div>
            <div class="pairing-list" id="pairingList">
              <div class="empty-state" style="padding:1.5rem 0;text-align:left">No pairings added yet.</div>
            </div>
          </div>
        </div>
      </div>

    </div><!-- /menuSection -->

  </div><!-- /form-panel -->

  <!-- LIST PANEL -->
  <div class="list-panel">

    <!-- Tab bar -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tabWine">Wine List</button>
      <button class="tab-btn" id="tabMenu">Menu</button>
    </div>

    <!-- Wine list content -->
    <div id="wineListContent">
      <div class="list-header">
        <h2>Wine List</h2>
        <span class="entry-count" id="entryCount"></span>
        <div class="list-search">
          <input type="text" id="listSearch" placeholder="Filter list…">
        </div>
      </div>
      <div id="listBody">
        <div class="empty-state">Loading…</div>
      </div>
    </div>

    <!-- Menu list content -->
    <div id="menuListContent">
      <div class="menu-list-header">
        <h2>Menu Items</h2>
      </div>
      <div id="menuListBody">
        <div class="empty-state">Loading…</div>
      </div>
    </div>

  </div><!-- /list-panel -->
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { hexToHsl, hslToHex, applyTheme, initContrastToggle } from '/public/theme.js';

  // ── Helpers ────────────────────────────────────────────────────────────────
  const slug = location.pathname.split('/')[1];
  initContrastToggle('btnContrast');
  document.getElementById('slugBadge').textContent = slug;
  document.getElementById('homeLink').href = `/${slug}`;
  document.getElementById('btnServerView').href = `/${slug}/server`;

  function $(id) { return document.getElementById(id); }
  function fmt$(v) { return v != null ? `$${Number(v).toFixed(2)}` : '—'; }

  function showToast(msg, isError = false) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  // ── Tab switching ──────────────────────────────────────────────────────────
  function setTab(tab) {
    const isWine = tab === 'wine';
    $('tabWine').classList.toggle('active', isWine);
    $('tabMenu').classList.toggle('active', !isWine);
    $('wineListContent').style.display = isWine ? 'block' : 'none';
    $('menuListContent').style.display = isWine ? 'none' : 'flex';
    $('wineSection').style.display = isWine ? 'flex' : 'none';
    $('menuSection').style.display = isWine ? 'none' : 'flex';
    if (!isWine) {
      hidePairingPanel();
      loadMenuItems();
    }
    $('modeBadge').style.display = isWine ? '' : 'none';
  }

  $('tabWine').addEventListener('click', () => setTab('wine'));
  $('tabMenu').addEventListener('click', () => setTab('menu'));

  // ── State ──────────────────────────────────────────────────────────────────
  let editingId = null;
  let allEntries = [];
  let sortState = { col: null, dir: 'asc' };
  let selectedBeverage = null;
  let allWineListEntries = [];

  // ── Logo & Theme ──────────────────────────────────────────────────────────
  let pendingLogoFile = null;

  async function loadLogo() {
    try {
      const res = await fetch(`/api/${slug}/restaurant`);
      if (!res.ok) return;
      const data = await res.json();
      if (data.logo_image_path) {
        const path = '/' + data.logo_image_path.replace(/\\/g, '/');
        showLogoPreview(path);
        const logo = $('headerLogo');
        logo.src = path;
        logo.style.display = 'block';
      }
      if (data.theme_accent) $('themeAccent').value = data.theme_accent;
      if (data.theme_bg) $('themeBg').value = data.theme_bg;
      applyTheme(data.theme_accent, data.theme_bg);
    } catch (e) { /* silent */ }
  }

  function showLogoPreview(src) {
    $('logoPreviewImg').src = src;
    $('logoPreviewImg').classList.add('show');
    $('logoPlaceholderIcon').classList.add('hidden');
  }

  $('themeAccent').addEventListener('input', () => applyTheme($('themeAccent').value, $('themeBg').value));
  $('themeBg').addEventListener('input', () => applyTheme($('themeAccent').value, $('themeBg').value));

  $('logoInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    pendingLogoFile = file;
    showLogoPreview(URL.createObjectURL(file));
  });

  $('btnLogoSave').addEventListener('click', async () => {
    const fd = new FormData();
    if (pendingLogoFile) fd.append('logo_image', pendingLogoFile);
    fd.append('theme_accent', $('themeAccent').value);
    fd.append('theme_bg', $('themeBg').value);
    try {
      const res = await fetch(`/api/${slug}/restaurant`, { method: 'PUT', body: fd });
      if (!res.ok) { showToast('Save failed', true); return; }
      pendingLogoFile = null;
      showToast('Saved');
    } catch (e) { showToast('Network error', true); }
  });

  // ── Type checkboxes ────────────────────────────────────────────────────────
  const TYPES = ['White','Red','Rosé','Champagne','Sparkling Wine','Beer','Cocktail','Mocktail','Soda'];
  const typeGrid = $('typeGrid');
  TYPES.forEach(t => {
    const pill = document.createElement('label');
    pill.className = 'checkbox-pill';
    pill.innerHTML = `<input type="checkbox" value="${t}"><span>${t}</span>`;
    pill.querySelector('input').addEventListener('change', () => {
      pill.classList.toggle('checked', pill.querySelector('input').checked);
    });
    typeGrid.appendChild(pill);
  });

  function getSelectedTypes() {
    return [...typeGrid.querySelectorAll('input:checked')].map(i => i.value);
  }
  function setSelectedTypes(arr) {
    typeGrid.querySelectorAll('.checkbox-pill').forEach(pill => {
      const val = pill.querySelector('input').value;
      const on = arr.includes(val);
      pill.querySelector('input').checked = on;
      pill.classList.toggle('checked', on);
    });
  }

  // ── Rack dropdown ─────────────────────────────────────────────────────────
  async function loadRacks(selectId) {
    const res = await fetch(`/api/${slug}/racks`);
    const racks = await res.json();
    const sel = $('rackId');
    const prev = sel.value;
    sel.innerHTML = '<option value="">— No rack —</option>';
    racks.forEach(r => {
      const o = document.createElement('option');
      o.value = r.id;
      o.textContent = r.rack_number;
      sel.appendChild(o);
    });
    if (selectId) sel.value = selectId;
    else if (prev) sel.value = prev;
  }

  $('btnAddRack').addEventListener('click', () => {
    $('addRackRow').style.display = 'flex';
    $('newRackInput').focus();
    $('btnAddRack').style.display = 'none';
  });

  $('btnCancelRack').addEventListener('click', () => {
    $('addRackRow').style.display = 'none';
    $('newRackInput').value = '';
    $('btnAddRack').style.display = '';
  });

  async function saveNewRack() {
    const label = $('newRackInput').value.trim();
    if (!label) return;
    try {
      const res = await fetch(`/api/${slug}/racks`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rack_number: label }),
      });
      if (!res.ok) { showToast('Failed to create rack', true); return; }
      const { id } = await res.json();
      $('addRackRow').style.display = 'none';
      $('newRackInput').value = '';
      $('btnAddRack').style.display = '';
      await loadRacks(String(id));
      showToast(`Rack "${label}" added`);
    } catch (e) { showToast('Network error', true); }
  }

  $('btnSaveRack').addEventListener('click', saveNewRack);
  $('newRackInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') saveNewRack();
    if (e.key === 'Escape') $('btnCancelRack').click();
  });

  // ── Beverage combo box ─────────────────────────────────────────────────────
  let beverageDebounce = null;
  const beverageInput = $('beverageInput');
  const beverageList = $('beverageList');

  beverageInput.addEventListener('input', () => {
    clearTimeout(beverageDebounce);
    if (!beverageInput.value.trim()) { beverageList.classList.remove('open'); return; }
    beverageDebounce = setTimeout(() => searchBeverages(beverageInput.value), 200);
  });
  beverageInput.addEventListener('focus', () => {
    if (beverageInput.value.trim()) searchBeverages(beverageInput.value);
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.combo-wrap')) {
      beverageList.classList.remove('open');
      $('pairingComboList').classList.remove('open');
    }
  });

  async function searchBeverages(q) {
    const res = await fetch(`/api/beverages?q=${encodeURIComponent(q)}`);
    const items = await res.json();
    renderBeverageList(items);
  }

  function renderBeverageList(items) {
    beverageList.innerHTML = '';
    if (!items.length) {
      beverageList.innerHTML = '<div class="combo-empty">No beverages found</div>';
      beverageList.classList.add('open');
      return;
    }
    items.forEach(bev => {
      const div = document.createElement('div');
      div.className = 'combo-item';
      div.innerHTML = `<span>${bev.name}</span><span class="ci-sub">${bev.type}</span>`;
      div.addEventListener('mousedown', e => { e.preventDefault(); selectBeverage(bev); });
      beverageList.appendChild(div);
    });
    beverageList.classList.add('open');
  }

  function selectBeverage(bev) {
    selectedBeverage = bev;
    beverageInput.value = bev.name;
    $('beverageId').value = bev.id;
    $('generalPairing').value = bev.general_pairing || '';
    $('flavorProfile').value = bev.flavor_profile || '';
    if (!getSelectedTypes().length) setSelectedTypes([bev.type]);
    beverageList.classList.remove('open');
  }

  // ── Image previews ─────────────────────────────────────────────────────────
  function wirePreview(inputId, previewId) {
    $(inputId).addEventListener('change', e => {
      const file = e.target.files[0];
      const preview = $(previewId);
      if (file) { preview.src = URL.createObjectURL(file); preview.classList.add('show'); }
    });
  }
  wirePreview('labelImage', 'labelPreview');
  wirePreview('bottleImage', 'bottlePreview');

  // ── Form clear / populate ──────────────────────────────────────────────────
  function clearForm() {
    editingId = null;
    selectedBeverage = null;
    beverageInput.value = '';
    $('beverageId').value = '';
    $('generalPairing').value = '';
    $('flavorProfile').value = '';
    $('houseFlavorProfile').value = '';
    $('sommelierComments').value = '';
    $('housePairing').value = '';
    $('snackNotes').value = '';
    $('priceBtl').value = '';
    $('priceBtg').value = '';
    $('rackId').value = '';
    $('labelImage').value = '';
    $('bottleImage').value = '';
    $('labelPreview').classList.remove('show');
    $('bottlePreview').classList.remove('show');
    setSelectedTypes([]);
    $('winePairingSection').style.display = 'none';
    $('winePairingList').innerHTML = '';
    $('winePairingSearch').value = '';
    updateModeBadge();
    document.querySelectorAll('tbody tr.selected').forEach(r => r.classList.remove('selected'));
  }

  function populateForm(entry) {
    editingId = entry.id;
    beverageInput.value = entry.beverage_name || '';
    $('beverageId').value = entry.beverage_id;
    $('generalPairing').value = entry.general_pairing || '';
    $('flavorProfile').value = entry.flavor_profile || '';
    $('houseFlavorProfile').value = entry.house_flavor_profile || '';
    $('sommelierComments').value = entry.sommelier_comments || '';
    $('housePairing').value = entry.house_pairing || '';
    $('snackNotes').value = entry.snack_notes || '';
    $('priceBtl').value = entry.price_btl != null ? entry.price_btl : '';
    $('priceBtg').value = entry.price_btg != null ? entry.price_btg : '';
    $('rackId').value = entry.rack_id || '';
    const types = entry.beverage_type ? [entry.beverage_type] : [];
    setSelectedTypes(types);
    if (entry.label_image_path) {
      $('labelPreview').src = '/' + entry.label_image_path.replace(/\\/g, '/');
      $('labelPreview').classList.add('show');
    } else { $('labelPreview').classList.remove('show'); }
    if (entry.bottle_image_path) {
      $('bottlePreview').src = '/' + entry.bottle_image_path.replace(/\\/g, '/');
      $('bottlePreview').classList.add('show');
    } else { $('bottlePreview').classList.remove('show'); }
    updateModeBadge();
    $('winePairingSection').style.display = '';
    $('winePairingList').innerHTML = '';
    $('winePairingSearch').value = '';
    loadWinePairings(entry.id);
    $('beverageInput').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function updateModeBadge() {
    const badge = $('modeBadge');
    if (editingId) { badge.textContent = 'Editing'; badge.className = 'mode-badge edit'; }
    else { badge.textContent = 'New Entry'; badge.className = 'mode-badge new'; }
  }

  // ── Save wine entry ────────────────────────────────────────────────────────
  $('btnSave').addEventListener('click', async () => {
    let bevId = $('beverageId').value;
    if (!bevId) {
      const bevName = $('beverageInput').value.trim();
      if (!bevName) { showToast('Enter a beverage name', true); return; }
      const types = getSelectedTypes();
      if (!types.length) { showToast('Select a type first', true); return; }
      const createRes = await fetch('/api/beverages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: bevName, type: types[0] }),
      });
      const createData = await createRes.json();
      if (createRes.ok || createRes.status === 409) {
        bevId = String(createData.id);
        $('beverageId').value = bevId;
      } else {
        showToast(createData.error || 'Failed to create beverage', true);
        return;
      }
    }
    const fd = new FormData();
    fd.append('beverage_id', bevId);
    fd.append('rack_id', $('rackId').value);
    fd.append('sommelier_comments', $('sommelierComments').value);
    fd.append('house_pairing', $('housePairing').value);
    fd.append('house_flavor_profile', $('houseFlavorProfile').value);
    fd.append('snack_notes', $('snackNotes').value);
    fd.append('price_btl', $('priceBtl').value);
    fd.append('price_btg', $('priceBtg').value);
    const labelFile = $('labelImage').files[0];
    const bottleFile = $('bottleImage').files[0];
    if (labelFile) fd.append('label_image', labelFile);
    if (bottleFile) fd.append('bottle_image', bottleFile);
    const url = editingId ? `/api/${slug}/wine-list/${editingId}` : `/api/${slug}/wine-list`;
    const method = editingId ? 'PUT' : 'POST';
    try {
      const res = await fetch(url, { method, body: fd });
      if (!res.ok) { const err = await res.json(); showToast(err.error || 'Save failed', true); return; }
      showToast(editingId ? 'Entry updated' : 'Entry saved');
      clearForm();
      await loadList();
    } catch (e) { showToast('Network error', true); }
  });

  $('btnClear').addEventListener('click', clearForm);

  // ── Wine list table ────────────────────────────────────────────────────────
  function renderList(entries) {
    const listBody = $('listBody');
    $('entryCount').textContent = `${entries.length} wines`;
    if (!entries.length) {
      listBody.innerHTML = '<div class="empty-state">No entries yet. Add one using the form.</div>';
      return;
    }
    const table = document.createElement('table');
    const cols = [
      { label: 'Beverage', key: 'beverage_name' },
      { label: 'Type',     key: 'beverage_type' },
      { label: 'Rack',     key: 'rack_number' },
      { label: 'BTG',      key: 'price_btg' },
      { label: 'BTL',      key: 'price_btl' },
    ];
    const headerCells = cols.map(({ label, key }) => {
      const active = sortState.col === key;
      const ind = active ? (sortState.dir === 'asc' ? '▲' : '▼') : '';
      return `<th data-sort="${key}" class="${active ? 'sort-active' : ''}">${label}<span class="sort-ind">${ind}</span></th>`;
    }).join('') + '<th></th>';
    table.innerHTML = `<thead><tr>${headerCells}</tr></thead><tbody></tbody>`;
    table.querySelectorAll('th[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.sort;
        if (sortState.col === key) {
          sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
        } else {
          sortState.col = key;
          sortState.dir = 'asc';
        }
        applyFilter();
      });
    });
    const tbody = table.querySelector('tbody');
    entries.forEach(entry => {
      const tr = document.createElement('tr');
      if (entry.id === editingId) tr.classList.add('selected');
      tr.innerHTML = `
        <td class="td-name">${entry.beverage_name}</td>
        <td class="td-type">${entry.beverage_type || '—'}</td>
        <td>${entry.rack_number ? `<span class="td-rack">${entry.rack_number}</span>` : '<span style="color:var(--text-muted)">—</span>'}</td>
        <td class="td-price">${fmt$(entry.price_btg)}</td>
        <td class="td-price">${fmt$(entry.price_btl)}</td>
        <td><button class="btn-sm danger btn-delete-wine">Delete</button></td>
      `;
      tr.querySelector('.btn-delete-wine').addEventListener('click', async e => {
        e.stopPropagation();
        if (!confirm(`Delete "${entry.beverage_name}" from the wine list?`)) return;
        const res = await fetch(`/api/${slug}/wine-list/${entry.id}`, { method: 'DELETE' });
        if (res.ok) {
          if (editingId === entry.id) clearForm();
          showToast('Entry deleted');
          await loadList();
        } else {
          showToast('Delete failed', true);
        }
      });
      tr.addEventListener('click', () => {
        document.querySelectorAll('tbody tr.selected').forEach(r => r.classList.remove('selected'));
        tr.classList.add('selected');
        populateForm(entry);
      });
      tbody.appendChild(tr);
    });
    listBody.innerHTML = '';
    listBody.appendChild(table);
  }

  async function loadList() {
    const res = await fetch(`/api/${slug}/wine-list`);
    allEntries = await res.json();
    allWineListEntries = allEntries;
    applyFilter();
  }

  function applyFilter() {
    const q = $('listSearch').value.toLowerCase();
    let filtered = q
      ? allEntries.filter(e => (e.beverage_name || '').toLowerCase().includes(q) || (e.rack_number || '').toLowerCase().includes(q))
      : allEntries.slice();
    if (sortState.col) {
      const dir = sortState.dir === 'asc' ? 1 : -1;
      filtered = filtered.slice().sort((a, b) => {
        const av = a[sortState.col] ?? '', bv = b[sortState.col] ?? '';
        return av < bv ? -dir : av > bv ? dir : 0;
      });
    }
    renderList(filtered);
  }

  $('listSearch').addEventListener('input', applyFilter);

  // ── Menu items CRUD ────────────────────────────────────────────────────────
  let menuItems = [];
  let editingMenuId = null;
  let selectedMenuItemId = null;

  async function loadMenuItems() {
    const res = await fetch(`/api/${slug}/menu-items`);
    menuItems = await res.json();
    renderMenuList();
  }

  function renderMenuList() {
    const body = $('menuListBody');
    if (!menuItems.length) {
      body.innerHTML = '<div class="empty-state">No menu items yet. Add one using the form.</div>';
      return;
    }
    body.innerHTML = '';
    menuItems.forEach(item => {
      const row = document.createElement('div');
      row.className = 'menu-item-row' + (item.id === selectedMenuItemId ? ' selected' : '');
      row.innerHTML = `
        <div class="mir-info">
          <div class="mir-name">${item.name}</div>
          <div class="mir-meta">${[item.category, item.price != null ? fmt$(item.price) : null, item.description].filter(Boolean).join(' · ') || ''}</div>
        </div>
        <div class="mir-actions">
          <button class="btn-sm btn-manage" data-id="${item.id}" data-name="${encodeURIComponent(item.name)}">Pairings</button>
          <button class="btn-sm btn-edit-menu" data-id="${item.id}">Edit</button>
          <button class="btn-sm danger btn-delete-menu" data-id="${item.id}">Delete</button>
        </div>
      `;
      body.appendChild(row);
    });

    body.querySelectorAll('.btn-manage').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const id = Number(btn.dataset.id);
        const name = decodeURIComponent(btn.dataset.name);
        openPairingPanel(id, name);
      });
    });
    body.querySelectorAll('.btn-edit-menu').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const item = menuItems.find(m => m.id === Number(btn.dataset.id));
        if (item) populateMenuForm(item);
      });
    });
    body.querySelectorAll('.btn-delete-menu').forEach(btn => {
      btn.addEventListener('click', async e => {
        e.stopPropagation();
        if (!confirm('Delete this menu item and all its pairings?')) return;
        const res = await fetch(`/api/${slug}/menu-items/${btn.dataset.id}`, { method: 'DELETE' });
        if (res.ok) { showToast('Menu item deleted'); await loadMenuItems(); }
        else showToast('Delete failed', true);
      });
    });
  }

  function clearMenuForm() {
    editingMenuId = null;
    $('menuItemName').value = '';
    $('menuItemCategory').value = '';
    $('menuItemDesc').value = '';
    $('menuItemPrice').value = '';
    $('menuItemOrder').value = '0';
    $('menuFormTitle').textContent = 'New Menu Item';
    $('btnMenuSave').textContent = 'Add Item';
  }

  function populateMenuForm(item) {
    editingMenuId = item.id;
    $('menuItemName').value = item.name;
    $('menuItemCategory').value = item.category || '';
    $('menuItemDesc').value = item.description || '';
    $('menuItemPrice').value = item.price != null ? item.price : '';
    $('menuItemOrder').value = item.sort_order || 0;
    $('menuFormTitle').textContent = 'Edit Menu Item';
    $('btnMenuSave').textContent = 'Save Changes';
    $('menuItemForm').style.display = '';
    $('pairingSection').style.display = 'none';
    $('menuItemName').focus();
  }

  $('btnMenuClear').addEventListener('click', clearMenuForm);

  $('btnMenuSave').addEventListener('click', async () => {
    const name = $('menuItemName').value.trim();
    if (!name) { showToast('Name is required', true); return; }
    const body = {
      name,
      category: $('menuItemCategory').value.trim() || null,
      description: $('menuItemDesc').value.trim() || null,
      price: $('menuItemPrice').value !== '' ? Number($('menuItemPrice').value) : null,
      sort_order: Number($('menuItemOrder').value) || 0,
    };
    const url = editingMenuId ? `/api/${slug}/menu-items/${editingMenuId}` : `/api/${slug}/menu-items`;
    const method = editingMenuId ? 'PUT' : 'POST';
    try {
      const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!res.ok) { showToast('Save failed', true); return; }
      showToast(editingMenuId ? 'Menu item updated' : 'Menu item added');
      clearMenuForm();
      await loadMenuItems();
    } catch (e) { showToast('Network error', true); }
  });

  // ── Pairing management ─────────────────────────────────────────────────────
  function openPairingPanel(itemId, itemName) {
    selectedMenuItemId = itemId;
    $('pairingDishLabel').textContent = itemName;
    $('menuItemForm').style.display = 'none';
    $('pairingSection').style.display = 'flex';
    $('pairingSearch').value = '';
    $('pairingComboList').classList.remove('open');
    renderMenuList();
    loadPairings(itemId);
  }

  function hidePairingPanel() {
    selectedMenuItemId = null;
    $('pairingSection').style.display = 'none';
    $('menuItemForm').style.display = '';
    clearMenuForm();
  }

  $('btnPairingBack').addEventListener('click', hidePairingPanel);

  async function loadPairings(itemId) {
    const res = await fetch(`/api/${slug}/menu-items/${itemId}/pairings`);
    const pairings = await res.json();
    renderPairingList(pairings, itemId);
  }

  function renderPairingList(pairings, itemId) {
    const list = $('pairingList');
    if (!pairings.length) {
      list.innerHTML = '<div style="padding:0.5rem 0;font-size:0.85rem;color:var(--text-muted)">No pairings added yet.</div>';
      return;
    }
    list.innerHTML = '';
    pairings.forEach(p => {
      const row = document.createElement('div');
      row.className = 'pairing-row';
      row.innerHTML = `
        <div class="pairing-row-info">
          <div class="pairing-row-name">${p.beverage_name}</div>
          <div class="pairing-row-type">${p.beverage_type || ''}${p.rack_number ? ' · Rack ' + p.rack_number : ''}</div>
        </div>
        <button class="btn-remove-pairing" data-pairing-id="${p.pairing_id}">Remove</button>
      `;
      row.querySelector('.btn-remove-pairing').addEventListener('click', async () => {
        const res = await fetch(`/api/${slug}/menu-items/${itemId}/pairings/${p.pairing_id}`, { method: 'DELETE' });
        if (res.ok) loadPairings(itemId);
        else showToast('Remove failed', true);
      });
      list.appendChild(row);
    });
  }

  // Pairing search combo — searches the wine list
  let pairingSearchDebounce = null;
  const pairingSearchInput = $('pairingSearch');
  const pairingComboList = $('pairingComboList');

  pairingSearchInput.addEventListener('input', () => {
    clearTimeout(pairingSearchDebounce);
    const q = pairingSearchInput.value.trim().toLowerCase();
    if (!q) { pairingComboList.classList.remove('open'); return; }
    pairingSearchDebounce = setTimeout(() => {
      const matches = allWineListEntries.filter(e => e.beverage_name.toLowerCase().includes(q)).slice(0, 15);
      renderPairingCombo(matches);
    }, 150);
  });

  function renderPairingCombo(items) {
    pairingComboList.innerHTML = '';
    if (!items.length) {
      pairingComboList.innerHTML = '<div class="combo-empty">No wines found</div>';
      pairingComboList.classList.add('open');
      return;
    }
    items.forEach(entry => {
      const div = document.createElement('div');
      div.className = 'combo-item';
      div.innerHTML = `<span>${entry.beverage_name}</span><span class="ci-sub">${entry.beverage_type || ''}${entry.rack_number ? ' · Rack ' + entry.rack_number : ''}</span>`;
      div.addEventListener('mousedown', async e => {
        e.preventDefault();
        pairingComboList.classList.remove('open');
        pairingSearchInput.value = '';
        if (!selectedMenuItemId) return;
        const res = await fetch(`/api/${slug}/menu-items/${selectedMenuItemId}/pairings`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ wine_list_id: entry.id }),
        });
        if (res.ok) { loadPairings(selectedMenuItemId); showToast('Pairing added'); }
        else if (res.status === 409) showToast('Already paired', true);
        else showToast('Failed to add pairing', true);
      });
      pairingComboList.appendChild(div);
    });
    pairingComboList.classList.add('open');
  }

  // ── Wine-side menu pairings ────────────────────────────────────────────────
  async function loadWinePairings(wineListId) {
    const res = await fetch(`/api/${slug}/wine-list/${wineListId}/pairings`);
    const pairings = await res.json();
    renderWinePairingList(pairings, wineListId);
  }

  function renderWinePairingList(pairings, wineListId) {
    const list = $('winePairingList');
    if (!pairings.length) {
      list.innerHTML = '<div style="padding:0.5rem 0;font-size:0.85rem;color:var(--text-muted)">No menu pairings yet.</div>';
      return;
    }
    list.innerHTML = '';
    pairings.forEach(p => {
      const row = document.createElement('div');
      row.className = 'pairing-row';
      row.innerHTML = `
        <div class="pairing-row-info">
          <div class="pairing-row-name">${p.name}</div>
          <div class="pairing-row-type">${p.category || ''}</div>
        </div>
        <button class="btn-remove-pairing" data-pairing-id="${p.pairing_id}">Remove</button>
      `;
      row.querySelector('.btn-remove-pairing').addEventListener('click', async () => {
        const r = await fetch(`/api/${slug}/wine-list/${wineListId}/pairings/${p.pairing_id}`, { method: 'DELETE' });
        if (r.ok) loadWinePairings(wineListId);
        else showToast('Remove failed', true);
      });
      list.appendChild(row);
    });
  }

  let winePairingSearchDebounce = null;
  const winePairingSearchInput = $('winePairingSearch');
  const winePairingComboList = $('winePairingComboList');

  winePairingSearchInput.addEventListener('input', () => {
    clearTimeout(winePairingSearchDebounce);
    const q = winePairingSearchInput.value.trim().toLowerCase();
    if (!q) { winePairingComboList.classList.remove('open'); return; }
    winePairingSearchDebounce = setTimeout(() => {
      const matches = menuItems.filter(m => m.name.toLowerCase().includes(q)).slice(0, 15);
      if (!matches.length) {
        winePairingComboList.innerHTML = '<div class="combo-empty">No menu items found</div>';
        winePairingComboList.classList.add('open');
        return;
      }
      winePairingComboList.innerHTML = '';
      matches.forEach(item => {
        const div = document.createElement('div');
        div.className = 'combo-item';
        div.innerHTML = `<span>${item.name}</span><span class="ci-sub">${item.category || ''}</span>`;
        div.addEventListener('mousedown', async e => {
          e.preventDefault();
          winePairingComboList.classList.remove('open');
          winePairingSearchInput.value = '';
          if (!editingId) return;
          const r = await fetch(`/api/${slug}/wine-list/${editingId}/pairings`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ menu_item_id: item.id }),
          });
          if (r.ok) { loadWinePairings(editingId); showToast('Pairing added'); }
          else if (r.status === 409) showToast('Already paired', true);
          else showToast(`Failed to add pairing (${r.status})`, true);
        });
        winePairingComboList.appendChild(div);
      });
      winePairingComboList.classList.add('open');
    }, 150);
  });

  winePairingSearchInput.addEventListener('blur', () => {
    setTimeout(() => winePairingComboList.classList.remove('open'), 150);
  });

  // ── Init ───────────────────────────────────────────────────────────────────
  (async () => {
    await Promise.all([loadRacks(), loadList(), loadLogo(), loadMenuItems()]);
  })();
</script>
</body>
</html>
