# Blueprint Preview Environments: every pull request gets its own throwaway,
# fully-running copy of the service (skip a PR with "[skip preview]" in its title).
# Idle previews are auto-cleaned after 7 days; a preview is destroyed when its PR is
# merged/closed. Enabled purely by this YAML on the linked branch — NO dashboard
# toggle. (Do NOT also enable the per-service "Pull Request Previews" / Service
# Previews toggle: that's a different feature that does not support initialDeployHook.)
# NOTE: a preview's persistent disk starts EMPTY (Render copies no prod data), and
# sync:false secrets are NOT copied in — the app needs neither to boot. The demo
# tenant is seeded by initialDeployHook below. See docs/runbook.md.
previews:
  generation: automatic
  expireAfterDays: 7

services:
  - type: web
    name: project-tannins
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node scripts/db-init.js && node src/app.js
    # Runs ONCE, on a service's first successful deploy (Render's documented way to
    # seed a new preview's database). Prod deployed long ago, so it never runs there;
    # each new preview environment runs it once. The seed is idempotent regardless.
    initialDeployHook: node scripts/db-init.js && node scripts/seed-preview-demo.js
    disk:
      name: tannins-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TANNINS_BAR_PASS
        sync: false
