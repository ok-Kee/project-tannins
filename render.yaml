# PR previews: we use Render's per-service "Pull Request Previews" (Service
# Previews), enabled via the dashboard toggle on the project-tannins service. Each
# open PR gets its own throwaway running copy with a fresh empty disk. On the empty
# disk the startCommand seeds a demo tenant (see below). See docs/runbook.md.
#
# NOT USED: Blueprint "Preview Environments" (the `previews:` block + initialDeployHook)
# require a paid Render Pro workspace, which this project isn't on — so that path is
# omitted. If you upgrade to Pro and want it, that's the cleaner mechanism; move the
# seed to an `initialDeployHook` and add a `previews:` block then.

services:
  - type: web
    name: project-tannins
    runtime: node
    plan: starter
    buildCommand: npm install
    # seed-preview-demo runs on every boot but self-gates: it seeds ONLY when the DB
    # has zero tenants AND we're not on the prod branch — so it's a no-op on prod
    # (always populated, branch=main) and seeds only a fresh preview's empty disk.
    # `|| true` keeps a seed hiccup from ever blocking the app from starting.
    startCommand: node scripts/db-init.js && (node scripts/seed-preview-demo.js || true) && node src/app.js
    disk:
      name: tannins-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TANNINS_BAR_PASS
        sync: false
