# Preview environments: every pull request gets its own throwaway, fully-running
# copy of the service (skip a PR with "[skip preview]" in its title). Idle previews
# are auto-cleaned after 7 days; a preview is destroyed when its PR is merged/closed.
# NOTE: a preview's persistent disk starts EMPTY (Render copies no prod data), and
# sync:false secrets are NOT copied to previews — the app needs neither to boot, and
# the demo tenant is seeded by the startCommand below (guarded by IS_PULL_REQUEST).
# See docs/runbook.md.
previews:
  generation: automatic
  expireAfterDays: 7

services:
  - type: web
    name: project-tannins
    runtime: node
    plan: starter
    buildCommand: npm install
    # seed-preview-demo runs on every boot but is hard-gated on IS_PULL_REQUEST=true
    # (a runtime var Render sets only in previews) and is idempotent — so it seeds a
    # preview once and is a ~no-op on prod. Kept in startCommand (not initialDeployHook)
    # because that runs in the full runtime env where IS_PULL_REQUEST is present, and
    # it re-applies on redeploys. `|| true` keeps a seed hiccup from blocking boot.
    startCommand: node scripts/db-init.js && (node scripts/seed-preview-demo.js || true) && node src/app.js
    disk:
      name: tannins-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TANNINS_BAR_PASS
        sync: false
